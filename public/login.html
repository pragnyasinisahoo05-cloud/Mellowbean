<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Mellow Bean Café</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/admin-login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                ☕
            </div>

            <p class="login-tag">
                MELLOW BEAN CAFÉ
            </p>

            <h1>
                Welcome <span>Back.</span>
            </h1>

            <p class="login-subtitle">
                Sign in to manage your café reservations.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <a href="index.html" class="back-home">
                ← Back to Mellow Bean
            </a>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
